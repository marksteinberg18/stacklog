<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1D1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StackLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --graphite: #1A1D1F;
    --panel: #1E2224;
    --plate: #33393D;
    --plate-lit: #4A5257;
    --chalk: #ECE8E1;
    --chalk-dim: #8D9296;
    --pin: #E8A33D;
    --pool: #4FA3A5;
    --warn: #D97A6C;
    --rule: #2A2F32;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--graphite); }

  body {
    color: var(--chalk);
    font-family: var(--body);
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 13px calc(70px + env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
    font-size: 16px;
    line-height: 1.45;
  }
  :focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .mark { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: .02em; line-height: .95; margin: 0; text-transform: uppercase; }
  .mark span { color: var(--pin); }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--chalk-dim); text-align: right; }

  .tabs { display: flex; gap: 4px; margin: 14px 0 16px; border-bottom: 1px solid var(--rule); }
  .tab { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--chalk-dim); padding: 8px 13px 9px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--pin); }

  .alert { border: 1px solid var(--warn); border-radius: 2px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; color: var(--chalk); }
  .alert b { color: var(--warn); }

  .banner { border: 1px solid var(--rule); border-left: 3px solid var(--pin); border-radius: 2px; padding: 11px 13px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .banner h2 { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 0; text-transform: uppercase; line-height: 1; }
  .banner p { margin: 4px 0 0; font-size: 13px; color: var(--chalk-dim); }
  .swap { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; font-weight: 600; background: transparent; color: var(--chalk-dim); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 11px; cursor: pointer; white-space: nowrap; }

  .card { border: 1px solid var(--rule); border-radius: 3px; margin-bottom: 8px; background: var(--panel); overflow: hidden; }
  .card.open { border-color: var(--plate-lit); }
  .card.done { opacity: .55; }

  .top { display: grid; grid-template-columns: 30px 1fr auto; gap: 11px; align-items: center; width: 100%; padding: 11px 12px; background: none; border: 0; color: inherit; text-align: left; font: inherit; cursor: pointer; }
  .stack { display: flex; flex-direction: column-reverse; gap: 2px; height: 44px; }
  .pl { height: 3px; background: var(--plate); border-radius: 1px; }
  .pl.lit { background: var(--plate-lit); }
  .pl.on { background: var(--pin); height: 4px; }

  .nm { font-family: var(--display); font-size: 20px; font-weight: 600; text-transform: uppercase; line-height: 1.05; }
  .sub { font-family: var(--mono); font-size: 11px; color: var(--chalk-dim); margin-top: 3px; }
  .sub .ok { color: var(--pool); }
  .sub .up { color: var(--pin); }
  .kg { font-family: var(--mono); font-weight: 600; font-size: 23px; text-align: right; line-height: 1; }
  .kg small { display: block; font-size: 10px; font-weight: 400; color: var(--chalk-dim); margin-top: 4px; letter-spacing: .06em; }

  .cbody { display: none; padding: 2px 12px 14px; border-top: 1px solid var(--rule); }
  .card.open .cbody { display: block; }

  .setting { font-size: 13px; color: var(--pool); border-left: 2px solid var(--pool); padding: 5px 0 5px 10px; margin: 12px 0 0; }
  .swapline { font-size: 13px; color: var(--chalk-dim); margin: 10px 0 0; }
  .swapline b { color: var(--chalk); font-weight: 600; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
  .fld label { display: block; font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk-dim); margin-bottom: 5px; }
  .step { display: grid; grid-template-columns: 40px 1fr 40px; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .step button { background: #252A2D; border: 0; color: var(--chalk); font-size: 20px; font-family: var(--mono); padding: 10px 0; cursor: pointer; line-height: 1; }
  .step button:active { background: var(--plate-lit); }
  .step input { background: transparent; border: 0; color: var(--chalk); font-family: var(--mono); font-weight: 600; font-size: 18px; text-align: center; width: 100%; padding: 9px 0; -moz-appearance: textfield; }
  .step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .pinout { font-family: var(--mono); font-size: 12px; color: var(--pin); margin-top: 7px; }

  .go { width: 100%; margin-top: 12px; background: var(--pin); color: var(--graphite); border: 0; border-radius: 2px; padding: 13px; font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .09em; cursor: pointer; }
  .go.did { background: var(--pool); }
  .go:active { filter: brightness(.9); }

  .nudge { margin-top: 11px; border-left: 2px solid var(--pin); padding: 6px 0 6px 10px; font-size: 13px; }

  .hist { margin-top: 12px; font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); }
  .hist h4 { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; color: var(--chalk-dim); font-weight: 600; }
  .hist ul { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted var(--rule); }
  .hist li:last-child { border: 0; }
  .timer {
    position: sticky; top: 0; z-index: 40;
    background: var(--graphite); border: 1px solid var(--rule); border-radius: 3px;
    padding: 9px 11px; margin-bottom: 14px;
  }
  .timer.live { border-color: var(--pin); }
  .timer.last { border-color: var(--warn); }
  .trow { display: flex; align-items: center; gap: 11px; }
  .tclock {
    font-family: var(--mono); font-weight: 600; font-size: 26px; line-height: 1;
    min-width: 74px; letter-spacing: -.01em;
  }
  .timer.live .tclock { color: var(--pin); }
  .timer.last .tclock { color: var(--warn); }
  .tlabel { flex: 1; font-size: 13px; color: var(--chalk-dim); line-height: 1.25; }
  .tbtn {
    font-family: var(--display); text-transform: uppercase; letter-spacing: .07em;
    font-weight: 700; font-size: 14px; padding: 10px 15px; border-radius: 2px;
    border: 0; background: var(--pin); color: var(--graphite); cursor: pointer; white-space: nowrap;
  }
  .tbtn.stop { background: transparent; color: var(--chalk-dim); border: 1px solid var(--rule); font-weight: 600; }
  .ttrack { height: 3px; background: var(--plate); border-radius: 2px; margin-top: 9px; overflow: hidden; }
  .tfill { height: 100%; background: var(--pin); width: 100%; }
  .timer.last .tfill { background: var(--warn); }
  .tpre { display: flex; gap: 5px; margin-top: 9px; }
  .tpre button {
    flex: 1; font-family: var(--mono); font-size: 13px; padding: 7px 0;
    background: transparent; color: var(--chalk-dim); border: 1px solid var(--rule);
    border-radius: 2px; cursor: pointer;
  }
  .tpre button.on { color: var(--graphite); background: var(--chalk); border-color: var(--chalk); }

  .hist .rise { color: var(--pin); }
  .hist .rr { display: flex; align-items: center; gap: 10px; }
  .del { background: none; border: 0; color: var(--chalk-dim); font-family: var(--mono); font-size: 15px; line-height: 1; padding: 4px 6px; cursor: pointer; border-radius: 2px; }
  .del.arm { color: var(--warn); border: 1px solid var(--warn); font-size: 11px; font-family: var(--body); }

  .tools { display: flex; gap: 14px; margin-top: 11px; font-family: var(--display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .tools button { background: none; border: 0; color: var(--chalk-dim); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; padding: 3px 0; }

  .blk { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--chalk-dim); margin: 20px 0 8px; display: flex; align-items: center; gap: 9px; }
  .blk::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

  .stat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .box { border: 1px solid var(--rule); border-radius: 3px; padding: 13px; background: var(--panel); }
  .box b { display: block; font-family: var(--mono); font-size: 26px; font-weight: 600; line-height: 1; }
  .box span { display: block; font-size: 12px; color: var(--chalk-dim); margin-top: 6px; }

  .bar { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px dotted var(--rule); font-size: 14px; }
  .bar .lbl { flex: 0 0 40%; font-family: var(--display); text-transform: uppercase; font-size: 15px; }
  .bar .track { flex: 1; height: 7px; background: var(--plate); border-radius: 1px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--pin); }
  .bar .val { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); min-width: 52px; text-align: right; }

  .big { width: 100%; margin-bottom: 9px; background: transparent; color: var(--chalk); border: 1px solid var(--plate-lit); border-radius: 2px; padding: 14px; font-family: var(--display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .07em; cursor: pointer; text-align: left; }
  .big.accent { background: var(--pin); color: var(--graphite); border-color: var(--pin); font-weight: 700; }
  .big small { display: block; font-family: var(--body); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 400; opacity: .75; margin-top: 3px; }

  .state { display: flex; align-items: center; gap: 9px; font-size: 14px; padding: 12px; border: 1px solid var(--rule); border-radius: 3px; background: var(--panel); margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .dot.good { background: var(--pool); }
  .dot.bad { background: var(--warn); }

  .note { font-size: 13px; color: var(--chalk-dim); margin-top: 16px; line-height: 1.5; }
  .empty { border: 1px dashed var(--rule); border-radius: 3px; padding: 24px 16px; text-align: center; color: var(--chalk-dim); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(90px); background: var(--chalk); color: var(--graphite); font-family: var(--display); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; font-size: 14px; padding: 10px 19px; border-radius: 2px; transition: transform 200ms ease; z-index: 60; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  dialog.md { background: var(--panel); color: var(--chalk); border: 1px solid var(--plate-lit); border-radius: 3px; padding: 19px; width: min(93vw, 400px); font-family: var(--body); }
  dialog.md::backdrop { background: rgba(0,0,0,.7); }
  dialog.md h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .07em; font-size: 19px; margin: 0 0 12px; }
  dialog.md label { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--chalk-dim); margin: 11px 0 5px; }
  dialog.md input, dialog.md textarea { width: 100%; background: #252A2D; border: 1px solid var(--rule); border-radius: 2px; color: var(--chalk); font-family: var(--mono); font-size: 15px; padding: 9px; }
  .acts { display: flex; gap: 8px; margin-top: 16px; }
  .acts button { flex: 1; font-family: var(--display); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; font-size: 15px; padding: 11px; border-radius: 2px; cursor: pointer; border: 1px solid var(--rule); background: transparent; color: var(--chalk-dim); }
  .acts button.yes { background: var(--chalk); color: var(--graphite); border-color: var(--chalk); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="head">
  <h1 class="mark">Stack<span>·</span>Log</h1>
  <div class="meta" id="meta">loading</div>
</div>

<div class="tabs" role="tablist">
  <button class="tab" data-tab="today" role="tab" aria-selected="true">Today</button>
  <button class="tab" data-tab="all" role="tab" aria-selected="false">Machines</button>
  <button class="tab" data-tab="stats" role="tab" aria-selected="false">Stats</button>
  <button class="tab" data-tab="data" role="tab" aria-selected="false">Backup</button>
</div>

<div class="timer" id="timer">
  <div class="trow">
    <span class="tclock" id="t-clock">1:00</span>
    <span class="tlabel" id="t-label">Rest between sets</span>
    <button class="tbtn" id="t-btn">Start</button>
  </div>
  <div class="ttrack"><div class="tfill" id="t-fill"></div></div>
  <div class="tpre" id="t-pre">
    <button data-t="45">45s</button>
    <button data-t="60" class="on">60s</button>
    <button data-t="90">90s</button>
    <button data-t="120">2m</button>
  </div>
</div>

<div id="view"><div class="empty">Loading…</div></div>

<dialog class="md" id="edit">
  <h3 id="edit-title">Edit machine</h3>
  <label for="e-name">Name</label>
  <input id="e-name" type="text">
  <label for="e-ref">Location in gym</label>
  <input id="e-ref" type="text">
  <label for="e-set">Seat and pad settings</label>
  <input id="e-set" type="text" placeholder="e.g. Seat 6, arms 2">
  <div class="acts"><button id="e-cancel">Cancel</button><button class="yes" id="e-save">Save</button></div>
</dialog>

<dialog class="md" id="csv">
  <h3 id="csv-title">Your log as CSV</h3>
  <textarea id="csv-text" readonly rows="9" style="font-size:12px;line-height:1.5"></textarea>
  <p style="font-size:12px;color:var(--chalk-dim);margin:9px 0 0">Copy puts it on the clipboard — paste it into a Drive document or an email to yourself. Save file sends it to Downloads.</p>
  <div class="acts"><button id="csv-close">Close</button><button id="csv-copy">Copy</button><button class="yes" id="csv-dl">Save file</button></div>
</dialog>

<input type="file" id="restore-file" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
(function () {
  const KEY = 'stacklog.local.v1';
  const PLATES = 14;
  const BASE = 5, MAJOR = 7.5, STEP = 2.5;

  const MACHINES = [
    { id:'a2', ref:'A2', name:'Shoulder Press',   grp:'Push', w:5,    swap:'a3', set:'' },
    { id:'a3', ref:'A3', name:'Triceps Press',    grp:'Push', w:20,   swap:'a2', set:'' },
    { id:'a4', ref:'A4', name:'Biceps Curl',      grp:'Pull', w:12.5, swap:'a5', set:'' },
    { id:'a5', ref:'A5', name:'Row',              grp:'Pull', w:15,   swap:'a4', set:'Try alternate-arm action' },
    { id:'a6', ref:'A6', name:'Pec Fly',          grp:'Push', w:5,    swap:'b2', set:'' },
    { id:'b1', ref:'B1', name:'Seated Leg Press', grp:'Legs', w:12.5, swap:'b5', set:'Seat 6' },
    { id:'b2', ref:'B2', name:'Chest Press',      grp:'Push', w:12.5, swap:'a6', set:'Arms at 2 (of 1-2-3)' },
    { id:'b3', ref:'B3', name:'Leg Curl (prone)', grp:'Legs', w:5,    swap:'b4', set:'Bring a small towel' },
    { id:'b4', ref:'B4', name:'Seated Leg Curl',  grp:'Legs', w:12.5, swap:'b3', set:'' },
    { id:'b5', ref:'B5', name:'Leg Extension',    grp:'Legs', w:12.5, swap:'b1', set:'' },
    { id:'c1', ref:'C1', name:'Abdominal',        grp:'Core', w:12.5, swap:'c4', set:'' },
    { id:'c2', ref:'C2', name:'Hip Adduction',    grp:'Core', w:20,   swap:'c3', set:'' },
    { id:'c3', ref:'C3', name:'Hip Abduction',    grp:'Core', w:20,   swap:'c2', set:'' },
    { id:'c4', ref:'C4', name:'Back Extension',   grp:'Core', w:20,   swap:'c1', set:'' }
  ];

  const SESSIONS = {
    A: { name:'Session A', tag:'Legs and push', ids:['b1','b5','b2','a2','c1'] },
    B: { name:'Session B', tag:'Legs and pull', ids:['b4','c3','a5','a3','c4'] }
  };
  const GRPS = ['Legs','Push','Pull','Core'];

  let S = { m: [], session: 'A', lastBackup: null, tab: 'today', tdur: 60 };
  let open = null, editing = null, pending = null;
  let storageOK = false;

  const $ = id => document.getElementById(id);
  const view = () => $('view');

  /* ---------- storage, with an honest fallback ---------- */
  function probe() {
    try {
      localStorage.setItem('__probe', '1');
      localStorage.removeItem('__probe');
      return true;
    } catch (e) { return false; }
  }

  function load() {
    storageOK = probe();
    let raw = null;
    if (storageOK) { try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; } }
    if (raw) {
      try {
        const p = JSON.parse(raw);
        S.m = p.m || []; S.session = p.session || 'A'; S.lastBackup = p.lastBackup || null;
        S.tdur = p.tdur || 60;
      } catch (e) { S.m = []; }
    }
    MACHINES.forEach(d => { if (!S.m.some(x => x.id === d.id)) S.m.push(Object.assign({ reps:12, sets:3, hist:[] }, d)); });
  }

  function save() {
    if (!storageOK) return;
    try { localStorage.setItem(KEY, JSON.stringify({ m: S.m, session: S.session, lastBackup: S.lastBackup, tdur: S.tdur })); }
    catch (e) { storageOK = false; toast('Storage full or blocked'); }
  }

  /* ---------- weights ---------- */
  function pinOf(w) {
    if (w < BASE) return null;
    const n = Math.floor((w - BASE) / MAJOR) + 1;
    const add = Math.round(((w - BASE) - (n - 1) * MAJOR) * 10) / 10;
    return { n, add };
  }
  function pinText(w) {
    const p = pinOf(w);
    if (!p) return 'below the stack';
    return 'Pin ' + p.n + (p.add ? ' plus the ' + p.add + ' kg add-on' : ' (no add-on)');
  }

  /* ---------- helpers ---------- */
  const byId = id => S.m.find(x => x.id === id);
  const days = iso => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  const dayKey = iso => new Date(iso).toISOString().slice(0, 10);
  const today = () => dayKey(new Date().toISOString());
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function ago(m) {
    if (!m.hist.length) return 'not logged yet';
    const d = days(m.hist[0].at);
    return d === 0 ? 'done today' : d === 1 ? 'yesterday' : d + ' days ago';
  }
  const didToday = m => m.hist.length && dayKey(m.hist[0].at) === today();
  const readyUp = m => m.hist.length >= 2 && m.hist[0].w === m.hist[1].w && m.hist[0].reps >= 12 && m.hist[1].reps >= 12;

  function visitDates() {
    const s = new Set();
    S.m.forEach(m => m.hist.forEach(h => s.add(dayKey(h.at))));
    return [...s].sort();
  }
  function visitsSinceBackup() {
    if (!S.lastBackup) return visitDates().length;
    return visitDates().filter(d => d > S.lastBackup).length;
  }
  function suggestSession() {
    const r = {};
    ['A','B'].forEach(k => {
      const ds = SESSIONS[k].ids.map(byId).filter(Boolean).map(m => m.hist.length ? days(m.hist[0].at) : 999);
      r[k] = ds.length ? Math.min(...ds) : 999;
    });
    return r.A >= r.B ? 'A' : 'B';
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1900);
  }

  /* ---------- pieces ---------- */
  function stackHTML(m) {
    const p = pinOf(m.w), n = p ? Math.min(p.n, PLATES) : 0;
    let o = '';
    for (let i = 1; i <= PLATES; i++) o += '<div class="pl' + (i === n ? ' on' : i < n ? ' lit' : '') + '"></div>';
    return '<div class="stack">' + o + '</div>';
  }
  function stepHTML(m, f, s) {
    return '<div class="step">' +
      '<button data-a="dec" data-f="' + f + '" data-s="' + s + '" aria-label="decrease">–</button>' +
      '<input type="number" data-f="' + f + '" value="' + m[f] + '" inputmode="decimal">' +
      '<button data-a="inc" data-f="' + f + '" data-s="' + s + '" aria-label="increase">+</button></div>';
  }
  function histHTML(m) {
    if (!m.hist.length) return '';
    const li = m.hist.slice(0, 8).map((h, i) => {
      const prev = m.hist[i + 1], cls = prev && h.w > prev.w ? ' class="rise"' : '';
      const d = new Date(h.at).toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
      return '<li><span>' + d + '</span><span class="rr"><span' + cls + '>' + h.w + ' kg · ' + h.sets + ' × ' + h.reps +
        '</span><button class="del" data-a="rm" data-i="' + i + '" aria-label="Delete this entry">×</button></span></li>';
    }).join('');
    return '<div class="hist"><h4>Recent</h4><ul>' + li + '</ul>' +
      '<p style="margin:7px 0 0;font-family:var(--body);font-size:12px">Tap × twice to remove a mistaken entry.</p></div>';
  }

  function cardHTML(m) {
    const isOpen = open === m.id, done = didToday(m), up = readyUp(m);
    const sw = m.swap ? byId(m.swap) : null;
    return '<div class="card' + (isOpen ? ' open' : '') + (done ? ' done' : '') + '" data-id="' + m.id + '">' +
      '<button class="top" data-a="open">' + stackHTML(m) +
        '<div><div class="nm">' + esc(m.name) + '</div><div class="sub">' + m.ref + ' · ' +
          (done ? '<span class="ok">' + ago(m) + '</span>' : ago(m)) +
          (up ? ' · <span class="up">add 2.5</span>' : '') + '</div></div>' +
        '<div class="kg">' + m.w + '<small>KG</small></div></button>' +
      '<div class="cbody">' +
        (m.set ? '<p class="setting">' + esc(m.set) + '</p>' : '') +
        (sw ? '<p class="swapline">If it is taken: <b>' + esc(sw.name) + '</b> (' + sw.ref + '), or skip ahead and come back.</p>' : '') +
        '<div class="row">' +
          '<div class="fld"><label>Weight</label>' + stepHTML(m, 'w', STEP) + '<div class="pinout">' + pinText(m.w) + '</div></div>' +
          '<div class="fld"><label>Reps</label>' + stepHTML(m, 'reps', 1) +
            '<label style="margin-top:9px">Working sets</label>' + stepHTML(m, 'sets', 1) + '</div>' +
        '</div>' +
        (up ? '<div class="nudge">Two sessions at ' + m.w + ' kg for 12+ reps. Go up to ' + (m.w + STEP) + ' kg.</div>' : '') +
        '<button class="go' + (done ? ' did' : '') + '" data-a="log">' + (done ? 'Log again' : 'Log it') + '</button>' +
        histHTML(m) +
        '<div class="tools"><button data-a="edit">Edit</button></div>' +
      '</div></div>';
  }

  /* ---------- views ---------- */
  function backupWarning() {
    const n = visitsSinceBackup();
    if (!storageOK) return '<div class="alert"><b>Nothing is being saved.</b> This browser is blocking local storage. Open the Backup tab to read why, and export before you close the page.</div>';
    if (n >= 4) return '<div class="alert"><b>' + n + ' visits since your last backup.</b> Worth sending a copy to Drive from the Backup tab.</div>';
    return '';
  }

  function renderToday() {
    const s = SESSIONS[S.session], list = s.ids.map(byId).filter(Boolean);
    const done = list.filter(didToday).length;
    return backupWarning() +
      '<div class="banner"><div><h2>' + s.name + '</h2><p>' + s.tag + ' · ' + done + ' of ' + list.length + ' done today</p></div>' +
      '<button class="swap" data-a="switch">Switch to ' + (S.session === 'A' ? 'B' : 'A') + '</button></div>' +
      list.map(cardHTML).join('') +
      '<p class="note">Listed in the order you walk past them. A machine dims once logged today, and each names a stand-in for when it is occupied.</p>';
  }

  function renderAll() {
    let out = backupWarning();
    GRPS.forEach(g => {
      const inG = S.m.filter(m => m.grp === g);
      if (inG.length) out += '<div class="blk">' + g + '</div>' + inG.map(cardHTML).join('');
    });
    return out + '<p class="note">Assisted Dip / Chin is left out on purpose. It is the only vertical pull in the gym, so it is worth one go with Edward before writing it off.</p>';
  }

  function renderStats() {
    const dates = visitDates(), all = S.m.flatMap(m => m.hist);
    if (!all.length) return '<div class="empty">Log a session and the numbers appear here.</div>';
    const volume = all.reduce((t, h) => t + h.w * h.reps * h.sets, 0);
    const week = all.filter(h => days(h.at) < 7).length;
    const heavy = S.m.filter(m => m.hist.length).map(m => ({ n: m.name, w: Math.max(...m.hist.map(h => h.w)) })).sort((a,b) => b.w - a.w)[0];
    const rows = S.m.filter(m => m.hist.length).map(m => ({
      name: m.name, now: m.hist[0].w, gain: m.hist[0].w - m.hist[m.hist.length - 1].w
    })).sort((a,b) => b.gain - a.gain);
    const max = Math.max(...rows.map(r => r.now), 1);
    return '<div class="stat">' +
      '<div class="box"><b>' + dates.length + '</b><span>gym visits logged</span></div>' +
      '<div class="box"><b>' + (volume / 1000).toFixed(1) + 't</b><span>total weight shifted</span></div>' +
      '<div class="box"><b>' + week + '</b><span>machines in last 7 days</span></div>' +
      '<div class="box"><b>' + (heavy ? heavy.w + 'kg' : '–') + '</b><span>heaviest, ' + (heavy ? esc(heavy.n.toLowerCase()) : '') + '</span></div></div>' +
      '<div class="blk">Current weight by machine</div>' +
      rows.map(r => '<div class="bar"><span class="lbl">' + esc(r.name) + '</span>' +
        '<span class="track"><span class="fill" style="width:' + (r.now / max * 100) + '%"></span></span>' +
        '<span class="val">' + r.now + ' kg' + (r.gain > 0 ? ' +' + r.gain : '') + '</span></div>').join('');
  }

  function renderData() {
    const n = visitsSinceBackup();
    return '<div class="state"><span class="dot ' + (storageOK ? 'good' : 'bad') + '"></span>' +
        (storageOK
          ? '<span>Saving to this phone. ' + (S.lastBackup ? 'Last backup ' + new Date(S.lastBackup).toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ', ' + n + ' visits since.' : 'No backup taken yet.') + '</span>'
          : '<span>Not saving. Anything you log will be lost when this page closes.</span>') +
      '</div>' +
      '<button class="big accent" data-a="backup">Back up<small>Copy the text, or save it as a file</small></button>' +
      '<button class="big" data-a="restore">Restore from a backup<small>Replaces everything with a saved file</small></button>' +
      '<button class="big" data-a="csv">Export as CSV<small>For a spreadsheet</small></button>' +
      '<p class="note">Two routes out, because file saves on a phone can be hard to find. ' +
      '<b>Copy</b> puts the whole log on the clipboard — paste it into a Drive document, or email it to yourself. ' +
      '<b>Save file</b> sends it to your Downloads folder, where you can share it into Drive. ' +
      'Either one counts as a backup, and Restore reads a saved file back.</p>' +
      '<p class="note">Nothing here talks to the internet once loaded, so the app works with no signal at all.</p>';
  }

  function render() {
    const d = visitDates();
    $('meta').textContent = d.length
      ? 'last visit ' + new Date(d[d.length - 1]).toLocaleDateString('en-GB', { day:'2-digit', month:'short' })
      : 'no visits yet';
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
    view().innerHTML = S.tab === 'today' ? renderToday()
      : S.tab === 'all' ? renderAll()
      : S.tab === 'stats' ? renderStats() : renderData();
  }

  /* ---------- rest timer ---------- */
  const T = { endsAt: 0, tick: null, ac: null, wake: null };

  function fmt(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function primeAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!T.ac) T.ac = new AC();
      if (T.ac.state === 'suspended') T.ac.resume();
    } catch (e) {}
  }

  function chime() {
    try {
      if (T.ac) {
        const n = T.ac.currentTime;
        [[0, 660], [0.2, 660], [0.4, 880]].forEach(([off, hz]) => {
          const o = T.ac.createOscillator(), g = T.ac.createGain();
          o.type = 'sine'; o.frequency.value = hz;
          g.gain.setValueAtTime(0.0001, n + off);
          g.gain.exponentialRampToValueAtTime(0.25, n + off + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, n + off + 0.18);
          o.connect(g); g.connect(T.ac.destination);
          o.start(n + off); o.stop(n + off + 0.2);
        });
      }
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([140, 90, 140]); } catch (e) {}
  }

  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator) { T.wake = await navigator.wakeLock.request('screen'); }
      else if (T.wake) { T.wake.release(); T.wake = null; }
    } catch (e) { T.wake = null; }
  }

  function paintTimer() {
    const bar = $('timer');
    const running = T.endsAt > 0;
    const left = running ? Math.max(0, Math.ceil((T.endsAt - Date.now()) / 1000)) : S.tdur;
    $('t-clock').textContent = fmt(left);
    $('t-fill').style.width = (running ? (left / S.tdur) * 100 : 100) + '%';
    $('t-btn').textContent = running ? 'Stop' : 'Start';
    $('t-btn').className = 'tbtn' + (running ? ' stop' : '');
    $('t-label').textContent = running
      ? (left <= 10 ? 'Almost — get set' : 'Resting')
      : 'Rest between sets';
    bar.className = 'timer' + (running ? (left <= 10 ? ' last' : ' live') : '');
    $('t-pre').style.display = running ? 'none' : 'flex';
    document.querySelectorAll('#t-pre button').forEach(b =>
      b.classList.toggle('on', parseInt(b.dataset.t, 10) === S.tdur));
  }

  function stopTimer(finished) {
    clearInterval(T.tick); T.tick = null; T.endsAt = 0;
    keepAwake(false);
    if (finished) chime();
    paintTimer();
  }

  function startTimer() {
    primeAudio();
    T.endsAt = Date.now() + S.tdur * 1000;
    keepAwake(true);
    clearInterval(T.tick);
    T.tick = setInterval(() => {
      if (Date.now() >= T.endsAt) stopTimer(true); else paintTimer();
    }, 250);
    paintTimer();
  }

  $('t-btn').addEventListener('click', () => { T.endsAt ? stopTimer(false) : startTimer(); });
  $('t-pre').addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    S.tdur = parseInt(b.dataset.t, 10); save(); paintTimer();
  });

  /* ---------- backup / restore ---------- */
  let dl = undefined;   // undefined = not asked yet, null = unavailable
  async function downloader() {
    if (dl !== undefined) return dl;
    try { dl = (window.claude && claude.use) ? await claude.use('downloads') : null; }
    catch (e) { dl = null; }
    return dl;
  }

  async function handOver(name, data, mime) {
    const d = await downloader();
    if (d && d.save) {
      try { await d.save({ filename: name, data: data }); return true; }
      catch (e) { if (e && /declin|cancel|abort/i.test(e.message || '')) return false; }
    }
    try {
      const file = new File([data], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'StackLog backup' });
        return true;
      }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: mime }));
      a.download = name; a.click();
      return true;
    } catch (e) { return false; }
  }

  async function backup() {
    const payload = JSON.stringify({ app: 'stacklog', saved: new Date().toISOString(), m: S.m, session: S.session }, null, 2);
    pending = { name: 'stacklog-' + today() + '.json', data: payload, mime: 'application/json' };
    $('csv-title').textContent = 'Backup — ' + today();
    $('csv-text').value = payload;
    $('csv').showModal();
  }

  function markBackedUp() { S.lastBackup = today(); save(); render(); }

  $('restore-file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(r.result);
        if (!p.m || !Array.isArray(p.m)) throw new Error('shape');
        S.m = p.m; S.session = p.session || 'A';
        MACHINES.forEach(d => { if (!S.m.some(x => x.id === d.id)) S.m.push(Object.assign({ reps:12, sets:3, hist:[] }, d)); });
        save(); toast('Restored'); render();
      } catch (err) { toast('That file is not a StackLog backup'); }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  function openCsv() {
    const rows = [['date','machine','location','group','weight_kg','sets','reps']];
    S.m.forEach(m => m.hist.forEach(h => rows.push([dayKey(h.at), '"' + m.name + '"', m.ref, m.grp, h.w, h.sets, h.reps])));
    if (rows.length === 1) { toast('Nothing logged yet'); return; }
    pending = { name: 'stacklog-' + today() + '.csv', data: rows.map(r => r.join(',')).join('\n'), mime: 'text/csv' };
    $('csv-title').textContent = 'Your log as CSV';
    $('csv-text').value = pending.data;
    $('csv').showModal();
  }

  /* ---------- events ---------- */
  document.querySelector('.tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    S.tab = t.dataset.tab; open = null; render();
  });

  view().addEventListener('click', async e => {
    const btn = e.target.closest('[data-a]'); if (!btn) return;
    const a = btn.dataset.a;

    if (a === 'switch') { S.session = S.session === 'A' ? 'B' : 'A'; save(); render(); return; }
    if (a === 'backup') { backup(); return; }
    if (a === 'restore') { $('restore-file').click(); return; }
    if (a === 'csv') { openCsv(); return; }

    const card = e.target.closest('.card'); if (!card) return;
    const m = byId(card.dataset.id); if (!m) return;

    if (a === 'open') { open = open === m.id ? null : m.id; render(); }
    else if (a === 'inc' || a === 'dec') {
      const f = btn.dataset.f, s = parseFloat(btn.dataset.s), min = f === 'w' ? BASE : 1;
      m[f] = Math.max(min, Math.round((m[f] + (a === 'inc' ? s : -s)) * 10) / 10);
      const inp = card.querySelector('input[data-f="' + f + '"]'); if (inp) inp.value = m[f];
      if (f === 'w') {
        const k = card.querySelector('.kg'); if (k) k.innerHTML = m.w + '<small>KG</small>';
        const st = card.querySelector('.stack'); if (st) st.outerHTML = stackHTML(m);
        const po = card.querySelector('.pinout'); if (po) po.textContent = pinText(m.w);
      }
      save();
    }
    else if (a === 'log') {
      m.hist.unshift({ at: new Date().toISOString(), w: m.w, reps: m.reps, sets: m.sets });
      m.hist = m.hist.slice(0, 80);
      save(); toast(m.name + ' logged'); open = null; render();
    }
    else if (a === 'rm') {
      if (btn.dataset.armed !== '1') {
        btn.dataset.armed = '1'; btn.textContent = 'sure?'; btn.classList.add('arm');
        setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = '0'; btn.textContent = '×'; btn.classList.remove('arm'); } }, 3000);
        return;
      }
      m.hist.splice(parseInt(btn.dataset.i, 10), 1);
      save(); toast('Entry removed'); render();
    }
    else if (a === 'edit') {
      editing = m.id;
      $('edit-title').textContent = m.name;
      $('e-name').value = m.name; $('e-ref').value = m.ref; $('e-set').value = m.set || '';
      $('edit').showModal();
    }
  });

  view().addEventListener('change', e => {
    const inp = e.target.closest('input[data-f]'); if (!inp) return;
    const m = byId(e.target.closest('.card').dataset.id);
    const v = parseFloat(inp.value);
    if (!isNaN(v)) { m[inp.dataset.f] = v; save(); render(); }
  });

  $('e-cancel').addEventListener('click', () => $('edit').close());
  $('e-save').addEventListener('click', () => {
    const m = byId(editing);
    if (m) { m.name = $('e-name').value.trim() || m.name; m.ref = $('e-ref').value.trim() || m.ref; m.set = $('e-set').value.trim(); save(); }
    $('edit').close(); render();
  });
  $('csv-close').addEventListener('click', () => $('csv').close());

  $('csv-copy').addEventListener('click', async () => {
    const t = $('csv-text');
    let ok = false;
    try { await navigator.clipboard.writeText(t.value); ok = true; }
    catch (e) {
      try { t.focus(); t.select(); ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    }
    if (ok) { toast('Copied'); if (pending && pending.mime === 'application/json') markBackedUp(); }
    else toast('Select the text and copy');
  });

  $('csv-dl').addEventListener('click', async () => {
    if (!pending) return;
    const ok = await handOver(pending.name, pending.data, pending.mime);
    if (ok) { toast('Saved to Downloads'); if (pending.mime === 'application/json') markBackedUp(); }
    else toast('Use Copy instead');
  });

  load();
  S.session = suggestSession();
  paintTimer();
  render();
})();
</script>
</body>
</html>
